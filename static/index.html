<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ООП Workspace Tabs OS</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Базовый сброс и разметка каркаса */
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      height: 100vh; 
      overflow: hidden;
      background-color: #f8f9fa;
    }

    /* Сайдбар слева */
    #sidebar { 
      width: 280px; 
      background: #f4f4f6; 
      border-right: 1px solid #d9e2ec; 
      display: flex; 
      flex-direction: column; 
      user-select: none;
    }
    #sidebar-header { 
      padding: 15px; 
      border-bottom: 1px solid #d9e2ec; 
      background: #fff;
    }
    
    /* Список сущностей и групп */
    #entity-list { 
      list-style: none; 
      padding: 0; 
      margin: 0; 
      flex-grow: 1; 
      overflow-y: auto; 
    }
    #entity-list li.entity-item { 
      padding: 10px 15px 10px 25px; 
      cursor: pointer; 
      border-bottom: 1px solid #eef2f6; 
      font-size: 0.95rem;
      color: #334e68;
      transition: background 0.2s ease;
    }
    #entity-list li.entity-item:hover { 
      background: #e2e8f0; 
    }
    #entity-list li.entity-item.active { 
      background: #bcccdc; 
      font-weight: bold;
      color: #102a43;
    }
    
    /* Заголовки групп сайдбара с кнопками добавления на лету */
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      background: #eaf0f6;
      padding: 8px 10px 8px 15px;
      font-size: 0.85rem;
      color: #4a5568;
      border-top: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
      margin-top: 15px;
    }
    .group-header:first-child { margin-top: 0; }
    .add-group-item-btn {
      background: transparent;
      border: none;
      color: #007bff;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    .add-group-item-btn:hover { background: #cbd5e1; }

    /* Правая основная рабочая зона */
    #main-content-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #fff;
    }

    /* Верхняя горизонтальная полоса Менеджера Вкладок (Tab Bar) */
    #tabs-bar {
      min-height: 38px;
      background: #e2e8f0;
      border-bottom: 1px solid #cbd5e1;
      user-select: none;
    }

    /* Динамический холст для монтирования активного компонента */
    #workspace-canvas { 
      flex-grow: 1; 
      padding: 25px; 
      overflow-y: auto; 
      position: relative;
    }

    /* Пустое приветственное состояние */
    #empty-state { 
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; 
      color: #627d98; 
      font-style: italic;
      font-size: 1.1rem;
    }

    /* Индикатор сетевой синхронизации */
    .sidebar-header-content { display: flex; align-items: center; justify-content: space-between; }
    .sync-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
    .sync-badge.synced { background-color: #e6f4ea; color: #137333; }
    .sync-badge.syncing { background-color: #feefe3; color: #b06000; }
    .sync-badge.offline { background-color: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

  <!-- ЛЕВАЯ ПАНЕЛЬ: Сайдбар управления и навигации -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div class="sidebar-header-content">
        <h3 id="workspace-title" style="margin: 0; font-size: 1.1rem; color: #102a43;">Загрузка...</h3>
        <!-- Индикатор статуса синхронизации данных -->
        <span id="sync-status" class="sync-badge offline">
          <span class="sync-icon">⏳</span>
          <span class="sync-text">Старт</span>
        </span>
      </div>
    </div>
    <!-- Динамический список групп (Заметки, Проекты, Справочники, Роботы) -->
    <ul id="entity-list"></ul>
  </aside>

  <!-- ПРАВАЯ ПАНЕЛЬ: Модульная операционная система вкладок -->
  <div id="main-content-area">
    <!-- Полоса вкладок (Сюда TabsManager монтирует список Tab-плашек) -->
    <header id="tabs-bar"></header>

    <!-- Главный холст (Сюда монтируется Таблица, Форма или IDE Робота) -->
    <main id="workspace-canvas">
      <div id="empty-state">Выберите сущность в левом сайдбаре, чтобы открыть вкладку</div>
    </main>
  </div>

  <!-- Главный скрипт-оркестратор архитектуры приложения -->
  <script src="/js/app.js" type="module"></script>
  <script src="/js/jszip.min.js" type="module"></script>
</body>
</html>
